#
# OpenOCD 脚本: HPM6E8Y (hpm6e00YZ 板) + FT2232 探针 + JTAG 接口
#
# 用法:
#   调试 (GDB server, 端口 3333):
#     D:/sdk_env/tools/openocd/openocd.exe -f openocd.cfg
#   命令行烧录:
#     D:/sdk_env/tools/openocd/openocd.exe -f openocd.cfg \
#         -c "program build/output/demo.elf verify reset exit"
#
# 说明:
#   - HPM6E8Y 是 RISC-V 核, GDB 需用 riscv32-unknown-elf-gdb
#   - 探针 FT2232H (VID:PID 0x0403:0x6010), 接口 JTAG (本板 SWD 连不上)
#   - 探针配置用 OpenOCD 新命令语法 (ftdi vid_pid 等), soc/board 复用 SDK 脚本
#
# 注意: 必须用 HPM 定制版 OpenOCD (带 hpm_xpi flash 驱动与 riscv 调试支持),
#       upstream 标准版 OpenOCD 不含 hpm_xpi, 会加载失败。

# ---- SDK 根目录 (本工程内的本地化 SDK) ----
set HPM_SDK_BASE [file normalize [file dirname [info script]]/hpm_sdk_localized_for_hpm6e00YZ]
set HPM_OPENOCD_CONFIG ${HPM_SDK_BASE}/boards/openocd

# ---- 探针: FT2232H (JTAG) ----
bindto 0.0.0.0
adapter speed 10000

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# FT2232H 通道 A 的 MPSSE 引脚布局 (对应 SDK ft2232.cfg 的默认 JTAG 接法)
ftdi layout_init 0x0208 0x020b
ftdi layout_signal nTRST -data 0x0200 -noe 0x0400
ftdi layout_signal nSRST -data 0x0100 -noe 0x0800

transport select jtag

# ---- 目标: hpm6e80 单核 ----
source ${HPM_OPENOCD_CONFIG}/soc/hpm6e80-single-core.cfg

# ---- 板级: hpm6e00YZ (含 xpi0 flash bank 与复位时钟配置) ----
source ${HPM_OPENOCD_CONFIG}/boards/hpm6e00YZ.cfg
