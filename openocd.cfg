#
# OpenOCD 脚本: HPM6E8Y (hpm6e00YZ 板) + FT2232 探针 + JTAG 接口
#
# 用法:
#   调试 (GDB server, 端口 3333):
#     D:/sdk_env/tools/openocd/openocd.exe -f openocd.cfg
#   命令行烧录:
#     D:/sdk_env/tools/openocd/openocd.exe -f openocd.cfg \
#         -c "program build/output/demo.elf verify reset exit"
#
# 说明:
#   - HPM6E8Y 是 RISC-V 核, GDB 需用 riscv32-unknown-elf-gdb
#   - 探针 FT2232H (VID:PID 0x0403:0x6010), 接口 JTAG (本板 SWD 连不上)
#   - 探针配置用 OpenOCD 新命令语法 (ftdi vid_pid 等), soc/board 复用 SDK 脚本
#
# 注意: 必须用 HPM 定制版 OpenOCD (带 hpm_xpi flash 驱动与 riscv 调试支持),
#       upstream 标准版 OpenOCD 不含 hpm_xpi, 会加载失败。

# ---- SDK 根目录 (本工程内的本地化 SDK) ----
set HPM_SDK_BASE [file normalize [file dirname [info script]]/hpm_sdk_localized_for_hpm6e00YZ]
set HPM_OPENOCD_CONFIG ${HPM_SDK_BASE}/boards/openocd

# ---- 探针: FT2232H (JTAG) ----
bindto 0.0.0.0
adapter speed 10000

adapter driver ftdi
# 实测本板载 FT2232H 就是标准 VID/PID 0403:6010 (切勿改成 34B7:FFFF)
ftdi vid_pid 0x0403 0x6010

# FT2232H 通道 A 的 MPSSE 引脚布局 (对应 SDK ft2232.cfg 的默认 JTAG 接法)
ftdi layout_init 0x0208 0x020b
ftdi layout_signal nTRST -data 0x0200 -noe 0x0400
ftdi layout_signal nSRST -data 0x0100 -noe 0x0800

transport select jtag

# ---- 目标: hpm6e80 单核 ----
source ${HPM_OPENOCD_CONFIG}/soc/hpm6e80-single-core.cfg

# ---- 板级: hpm6e00YZ (含 xpi0 flash bank 与复位时钟配置) ----
source ${HPM_OPENOCD_CONFIG}/boards/hpm6e00YZ.cfg

# ---- Live Watch (Cortex-Debug 的 CORTEX LIVE WATCH 面板) ----
# 关键: 让 OpenOCD 允许"CPU 运行时读内存", 否则 Live Watch 只会报 Target not halted。
#   progbuf : 停机时用调试模块的程序缓冲, 最快 (默认首选, 下载/断点不受影响)
#   sysbus  : 运行时由调试模块的 System Bus Access (SBA) 直接读片上/Flash 内存,
#             CPU 继续全速运行, 只占用少量总线周期
#   abstract: 兜底
# 注意: 本芯片调试模块确实带 SBA (见 soc/hpm_common.cfg 里的 sba_write_mem 实现,
#       用的是 dmsbcs/dmsbaddress0 寄存器), 所以 sysbus 方式可用。
riscv set_mem_access progbuf sysbus abstract

# 关掉"软件地址翻译"检测 —— 否则 OpenOCD 每次读内存前都要去读 priv/mstatus/satp
# 这些 CSR, 而 CPU 正在全速运行时这些寄存器读不到, 于是每采样一次就刷屏:
#     [hpm6e00.cpu0] Failed to read priv register.
# 本工程是裸机(无 MMU), 地址即物理地址, 所以直接关掉最干净、也更快。
# (默认值是 sw; 可选值 off / hw / sw, 这里按 target 设置)
$_TARGET0 riscv virt2phys_mode off

# 说明: launch.json 里打开 liveWatch 后, Cortex-Debug 会自动
#   1) 在加载本文件之前 source <扩展>/support/openocd-helpers.tcl
#   2) 在本文件之后追加 -c "CDLiveWatchSetup" —— 把 target 的 gdb-max-connections
#      从 1 提升到 2, 好让第二个("live-monitor")GDB 连接能连上同一个 gdb_port。
#   所以这里不需要再手动设置 gdb-max-connections。
